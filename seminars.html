<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>交大计算机系讲座 · 灵记</title>
<style>
  :root {
    --brand: #3D6FF2;
    --brand2: #FF8A3D;
    --bg: #f6f8fc;
    --card: #ffffff;
    --ink: #1c2433;
    --muted: #6b7689;
    --line: #e7ecf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    padding: 26px 20px 20px;
    background: linear-gradient(120deg, var(--brand) 0%, var(--brand2) 100%);
    color: #fff;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: .5px; }
  header p { margin: 0; opacity: .92; font-size: 13px; }
  .back { display: inline-block; margin-top: 10px; font-size: 12px; color: #fff; opacity: .9; text-decoration: none; border: 1px solid rgba(255,255,255,.6); padding: 3px 10px; border-radius: 999px; }
  .back:hover { background: rgba(255,255,255,.15); }
  #updated { font-size: 12px; opacity: .85; margin-top: 8px; }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(40, 64, 120, .06);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(40, 64, 120, .12); }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .card h2 a { color: var(--ink); text-decoration: none; }
  .card h2 a:hover { color: var(--brand); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
  .meta .tag { background: #eef3ff; color: var(--brand); border-radius: 999px; padding: 2px 10px; }
  .poster { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; margin-top: 12px; background: #f0f3fa; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 30px; }
  footer a { color: var(--brand); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>上海交通大学 · 计算机系讲座</h1>
    <p>SJTU CS Seminars · 自动抓取自 cs.sjtu.edu.cn 学术活动 · 由灵记托管</p>
    <a class="back" href="./">← 返回灵记</a>
    <div id="updated">加载中…</div>
  </div>
</header>
<main>
  <div id="list"><div class="empty">正在加载讲座列表…</div></div>
</main>
<footer>
  数据来源：<a href="https://cs.sjtu.edu.cn/xshd.html" target="_blank" rel="noopener">上海交通大学计算机系官网</a>
  · 由 GitHub Actions 定时更新
</footer>

<script>
const DATA_URL = "./data/seminars.json";
function esc(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function meta(s) {
  const parts = [];
  if (s.date) parts.push(`<span class="tag">📅 ${esc(s.date)}</span>`);
  if (s.time) parts.push(`<span>🕒 ${esc(s.time)}</span>`);
  if (s.location) parts.push(`<span>📍 ${esc(s.location)}</span>`);
  if (s.speaker) parts.push(`<span>🎤 ${esc(s.speaker)}</span>`);
  return parts.join("");
}
async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const list = document.getElementById("list");
    document.getElementById("updated").textContent =
      "最近更新：" + new Date(data.generatedAtISO || data.updated_at).toLocaleString("zh-CN");
    if (!data.seminars || !data.seminars.length) {
      list.innerHTML = '<div class="empty">暂无讲座通知</div>';
      return;
    }
    list.innerHTML = data.seminars.map(s => `
      <div class="card">
        <h2><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a></h2>
        <div class="meta">${meta(s)}</div>
        ${s.poster ? `<img class="poster" src="${esc(s.poster)}" alt="海报"
            onerror="this.style.display='none'" />` : ""}
      </div>`).join("");
  } catch (e) {
    document.getElementById("list").innerHTML =
      '<div class="empty">加载失败：' + esc(e.message) + '<br/>请稍后刷新。</div>';
  }
}
load();
</script>
</body>
</html>
