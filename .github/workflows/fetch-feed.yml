name: 自动抓取论文与资讯

on:
  schedule:
    # cron 用的是 UTC 时间；下面两条分别对应北京时间 06:20 与 18:20
    - cron: '20 22 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch:        # 允许在 GitHub 网页上手动点「Run workflow」立即抓一次

permissions:
  contents: write           # 需要写权限才能把抓取结果提交回仓库

concurrency:
  group: lingji-fetch-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取论文与资讯
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-feed.mjs

      - name: 提交抓取结果
        run: |
          git config user.name  "lingji-bot"
          git config user.email "lingji-bot@users.noreply.github.com"
          git add data/feed.json data/news.json
          if git diff --cached --quiet; then
            echo "抓取结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(auto): 自动抓取 $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 同一仓库还承载着多端同步的 data/state.json，可能被 App 并发写入，
          # 因此推送失败时先 rebase 再重试，避免把同步数据挤掉。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "推送连续失败" >&2
          exit 1
