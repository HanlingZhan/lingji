<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灵记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>灵记 · 个人工作台</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="assets/icon.svg">
</head>
<body>
<div id="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 100 100" width="38" height="38" role="img" aria-label="灵记 Logo">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1565c0"/><stop offset="1" stop-color="#42a5f5"/></linearGradient></defs>
          <rect width="100" height="100" rx="24" fill="url(#lg)"/>
          <path d="M30 26 V70 a6 6 0 0 0 6 6 H72" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
          <path d="M64 30 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#ffd54f"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>灵记</strong>
        <span id="brandSub">LíngJì · 个人工作台</span>
      </div>
      <button class="icon-btn only-mobile" id="closeDrawer" aria-label="关闭">✕</button>
    </div>
    <nav class="nav" id="mainNav"></nav>
    <div class="sidebar-foot">
      <div class="sync-chip" id="syncChip" title="点击立即同步">
        <span class="dot"></span><span id="syncText">本地已保存</span>
      </div>
      <button class="ghost-btn" id="themeToggle">🌗 深色模式</button>
    </div>
  </aside>
  <div class="drawer-mask" id="drawerMask"></div>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openDrawer" aria-label="菜单">☰</button>
      <div class="topbar-title">
        <h1 id="pageTitle">工作台</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <div class="quick-add">
          <button class="primary-btn" id="quickAddBtn">＋ 快速新建</button>
          <div class="quick-menu" id="quickMenu">
            <button data-qa="reminder">🔔 提醒事项</button>
            <button data-qa="task">📋 看板任务</button>
            <button data-qa="anniversary">💝 纪念日</button>
            <button data-qa="course">📚 课程</button>
          </div>
        </div>
        <button class="icon-btn" id="bellBtn" aria-label="通知">🔔<span class="badge" id="bellBadge" hidden></span></button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>

  <!-- 移动端底部导航 -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 通知面板 -->
<div class="notif-panel" id="notifPanel" hidden>
  <div class="notif-head"><strong>通知中心</strong><button class="ghost-btn sm" id="clearNotif">全部已读</button></div>
  <div id="notifList" class="notif-list"></div>
</div>

<!-- 模态框 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modalTitle">标题</h3><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
